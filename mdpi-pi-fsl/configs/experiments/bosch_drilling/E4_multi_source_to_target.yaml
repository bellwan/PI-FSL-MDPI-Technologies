description: "E4 - Multi-source generalization: M01 (OP05 + OP07) → M02_OP05"
seeds: [42, 123, 456, 789, 101112]

# Domains
source_domains:
  - machine: "M01"
    operation: "OP07"
    periods: ["Aug-19", "Feb-19", "Aug-21"]
    description: "Source OP07 on M01"

  - machine: "M01"
    operation: "OP05"
    periods: ["Aug-19", "Feb-19", "Feb-21"]
    description: "Additional source OP05 on M01 (multi-source)"

target_domains:
  - machine: "M02"
    operation: "OP05"
    periods: ["Feb-19"]
    description: "Target machine + operation shift (M02, OP05)"

# Few-shot episodic setup
few_shot_setting:
  n_way: 2
  k_shot: [1, 5]
  query_size: 15
  episodes: 1200
  validation_episodes: 200

# Model
model_config:
  name: "RelationNet"
  channels: [32, 32, 64, 64]
  embedding_dim: 64
  relation_dim: 64
  dropout: 0.1
  batch_norm: true

# Training
training_config:
  optimizer: "Adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "StepLR"
  step_size: 400
  gamma: 0.5
  early_stopping_patience: 50
  gradient_clipping: 1.0

  transfer_learning:
    enabled: true
    episodes: 200
    k_shot: 5
    query_size: 15
    learning_rate: 0.0005
    weight_decay: 0.0001
    step_size: 100
    gamma: 0.5

# Physics regularization
physics_regularization:
  enabled: true
  lambda_energy: 0.1
  lambda_spectral: 0.1
  lambda_envelope: 0.05
  spectral_bands:
    structural: [0, 75]
    bearing: [75, 300]
    tool_wear: [300, 1000]

# Evaluation
evaluation_config:
  episodes: 200

# Baselines
baselines:
  - name: "Standard_FSL"
    enabled: false
    strategy: "random"
    features: "cwt"
    physics_regularization: false

  - name: "SMOTE_FSL"
    enabled: false
    strategy: "smote"
    features: "cwt"
    physics_regularization: false

  - name: "PI-FSL"
    enabled: true
    strategy: "psd-guided"
    features: "cwt"
    physics_regularization: true
    transfer_finetune: true

# Ablations
ablation_studies:
  - component: "physics_regularization"
    variations: [true, false]
    description: "Ablation of physics-informed regularization"

  - component: "psd_sampling"
    variations: [true, false]
    description: "Ablation of PSD-guided sampling"
